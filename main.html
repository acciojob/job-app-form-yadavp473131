<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
	<form method="post">
        <label for="name">Name</label>
        <input type="text" id="name" required />
        <label for="email">Email</label>
        <input type="email" required id="email" />
        <label for="gender_m">Gender</label>
        <input type="radio" id="gender_m" name="gender" required />
        <label for="gender_f">Gender</label>
        <input type="radio" id="gender_f" name="gender" required/>
        <label for="laptop">Laptop Brands</label>
        <select id="laptop" >
            <option  value="apple">Apple</option>
            <option value="asus">Asus</option>
            <option value="hp">HP</option>
        </select>
        <label for="age">Age</label>
        <input type="number" id="age" required />
        <label for="dob">Date of Birth</label>
        <input type="date" id="dob"  required />
        <label for="password">Password</label>
        <input type="password" required id="password" placeholder="Password" />
        <label for="portfolio" >Portfolio URL</label>
        <input id="portfolio" type="url" required />
        <button type="submit">Submit</button>
    </form>
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
